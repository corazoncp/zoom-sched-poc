[project]
name = "zoom-sched-poc"
version = "0.1.0"
description = "Zoom scheduling proof-of-concept web app for El Corazón como Portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "flask-limiter>=3.10.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.10.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
